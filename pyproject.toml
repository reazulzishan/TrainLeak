[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trainleak"
dynamic = ["version"]
description = "Find the data-leakage mistakes that make ML results too good to be true: copies across train/test, SMOTE before the split, columns that give the answer away."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Reazul Akter Zishan" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.23", "scikit-learn>=1.2"]
keywords = ["machine learning", "data leakage", "smote", "train test split", "data science", "research", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
excel = ["openpyxl>=3.1", "defusedxml>=0.7"]
all = ["pyarrow>=12", "openpyxl>=3.1", "defusedxml>=0.7"]

[project.scripts]
trainleak = "trainleak.cli:main"

[project.urls]
Homepage = "https://github.com/reazulzishan/TrainLeak"
Issues = "https://github.com/reazulzishan/TrainLeak/issues"
Changelog = "https://github.com/reazulzishan/TrainLeak/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "pandas-stubs", "nbformat>=5", "pyarrow>=12", "build>=1.2", "twine>=6"]

[tool.hatch.version]
path = "src/trainleak/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples/*.ipynb", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = ["error::FutureWarning:trainleak"]

[tool.coverage.run]
source = ["trainleak"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PT", "SIM", "RUF"]
ignore = ["E501", "E701", "E702", "S101", "RUF001", "RUF002", "RUF003", "SIM108"]  # E501: ruff format owns line length; long user-facing strings stay whole

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PT011", "PT018"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
