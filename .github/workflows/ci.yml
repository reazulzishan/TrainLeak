name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.pandas }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
        pandas: ["pandas>=2.2,<3", "pandas>=3"]
        exclude:
          - python: "3.10"
            pandas: "pandas>=3"          # pandas 3 needs Python 3.11+
        include:
          - os: ubuntu-latest            # oldest supported stack
            python: "3.10"
            pandas: "pandas>=2.0,<2.1"
            extra: "numpy<2 scikit-learn>=1.2,<1.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        env:
          PANDAS_SPEC: ${{ matrix.pandas }}
          EXTRA_SPECS: ${{ matrix.extra }}
        run: |
          uv venv
          # shellcheck disable=SC2086  # EXTRA_SPECS is a space-separated list on purpose
          uv pip install -e . "$PANDAS_SPEC" $EXTRA_SPECS pytest pytest-cov nbformat pyarrow
      - name: Test
        shell: bash
        run: uv run --no-sync pytest --cov --cov-report=term-missing

  build:
    name: build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/trainleak --version
          /tmp/smoke/bin/trainleak examples/smote_fixed.ipynb
          ! /tmp/smoke/bin/trainleak examples/smote_mistake.ipynb
